<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nexify</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-page h1 {
            font-size: 6rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .error-page h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .error-page p {
            color: var(--muted);
            max-width: 400px;
            margin: 0 auto 32px;
        }
        .error-page .btn {
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>Oops! The page you're looking for doesn't exist or has been moved.</p>
            <a href="/" class="btn btn-primary">Go Home</a>
        </div>
    </div>
</body>
</html>
