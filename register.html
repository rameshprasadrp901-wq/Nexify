<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MultiService Pro</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .auth-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] .auth-card {
            background: #1e1e1e;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo h2 {
            color: #4361ee;
            font-weight: 700;
        }
        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .role-option {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-option.active {
            border-color: #4361ee;
            background: rgba(67, 97, 238, 0.08);
        }
        .role-option i {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
        }
        .role-option .role-label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .role-option small {
            font-size: 0.75rem;
            color: #999;
        }
        .form-control {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }
        .btn-register {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(67, 97, 238, 0.3);
        }
        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }
        .divider span {
            background: white;
            padding: 0 15px;
            color: #999;
            position: relative;
        }
        [data-theme="dark"] .divider span {
            background: #1e1e1e;
        }
        .social-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: transparent;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        .social-btn:hover {
            background: #f5f5f5;
        }
        [data-theme="dark"] .social-btn:hover {
            background: #2d2d2d;
        }
        .form-check-input:checked {
            background-color: #4361ee;
            border-color: #4361ee;
        }
        .terms-text a {
            color: #4361ee;
            text-decoration: none;
        }
        .terms-text a:hover {
            text-decoration: underline;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h2><i class="fas fa-cube me-2"></i>MultiService Pro</h2>
                <p class="text-muted">Create your account</p>
            </div>
            
            <div id="messageContainer"></div>
            
            <!-- Role Selection -->
            <div class="role-selector">
                <div class="role-option active" data-role="customer" onclick="selectRole('customer')">
                    <i class="fas fa-user"></i>
                    <div class="role-label">Customer</div>
                    <small>Hire professionals</small>
                </div>
                <div class="role-option" data-role="employee" onclick="selectRole('employee')">
                    <i class="fas fa-user-tie"></i>
                    <div class="role-label">Professional</div>
                    <small>Offer services</small>
                </div>
            </div>
            
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" class="form-control" id="firstName" placeholder="First Name *" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="text" class="form-control" id="lastName" placeholder="Last Name *" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email Address *" required>
                </div>
                
                <div class="mb-3">
                    <input type="tel" class="form-control" id="phone" placeholder="Phone Number">
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="Password *" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength"></div>
                        <small class="text-muted">Minimum 6 characters</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm *" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label terms-text" for="terms">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> *
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
            </form>
            
            <div class="divider">
                <span>or</span>
            </div>
            
            <button class="social-btn">
                <i class="fab fa-google me-2 text-danger"></i>Continue with Google
            </button>
            <button class="social-btn">
                <i class="fab fa-facebook me-2 text-primary"></i>Continue with Facebook
            </button>
            
            <div class="text-center mt-4">
                <p class="text-muted">Already have an account? 
                    <a href="login.html" class="text-primary fw-bold">Sign In</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedRole = 'customer';

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.role === role);
            });
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('button i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const strength = document.getElementById('passwordStrength');
            const val = this.value;
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            
            const colors = ['#ddd', '#ff6b6b', '#fcc419', '#51cf66', '#339af0', '#4361ee'];
            const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
            strength.style.width = widths[Math.min(score, 5)];
            strength.style.backgroundColor = colors[Math.min(score, 5)];
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            if (!terms) {
                showMessage('You must agree to the terms', 'error');
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Creating...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName, lastName, email, phone, password,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showMessage('Registration successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        if (selectedRole === 'customer') window.location.href = 'dashboard/customer.html';
                        else window.location.href = 'dashboard/employee.html';
                    }, 1500);
                } else {
                    showMessage(data.message || 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const className = type === 'success' ? 'alert-success' : 'alert-danger';
            container.innerHTML = `
                <div class="alert ${className} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                const alert = container.querySelector('.alert');
                if (alert) alert.remove();
            }, 5000);
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user.role === 'admin') window.location.href = 'dashboard/admin.html';
                else if (user.role === 'employee') window.location.href = 'dashboard/employee.html';
                else window.location.href = 'dashboard/customer.html';
            }
        });
    </script>
</body>
</html>
